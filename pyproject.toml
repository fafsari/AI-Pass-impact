[project]
name = "impactproject"
version = "0.1.0"
description = "Ki-67 in the T1D pancreas: register immunofluorescence to H&E, quantify Ki-67, digital staining"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "girder-client>=5.0.18",
    "imagecodecs>=2026.10.10",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "plotly>=7.1.0",
    "requests>=2.34.2",
    "scikit-image>=0.26.0",
    "streamlit>=1.64.0",
    "tifffile>=2026.10.15",
    "zarr>=3.4.2",
]

[project.scripts]
impactproject = "impactproject:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
